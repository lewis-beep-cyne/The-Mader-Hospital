<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="illness.js"></script>

    <script>
        function populateIllnesses() {
            const select = document.getElementById("sickness");
            for (const illness in illnessMap) {
                const option = document.createElement("option");
                option.value = illness;
                option.textContent = illness.charAt(0).toUpperCase() + illness.slice(1);
                select.appendChild(option);
            }
        }

        function suggestMedication() {
            const illness = document.getElementById("sickness").value;
            const medication = illnessMap[illness] || "Please consult a doctor for proper prescription.";
            document.getElementById("medication").value = medication;
        }

        function checkAge() {
            const dob = document.getElementById("dob").value;
            if (!dob) return;

            const birthDate = new Date(dob);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }

            const idField = document.getElementById("idnoField");
            if (age < 18) {
                idField.style.display = "none";
            } else {
                idField.style.display = "block";
            }
        }

        function handleSubmit(event) {
            event.preventDefault(); 

            const userName = document.getElementById("fullname").value;
            const dob = document.getElementById("dob").value;
            const illness = document.getElementById("sickness").value;
            const medication = document.getElementById("medication").value;
            const idNumberField = document.getElementById("idno");
            const idNumber = idNumberField && idNumberField.offsetParent !== null ? idNumberField.value : "";

            const wantsAppointment = confirm("Do you want to book an appointment?");
            
            if (wantsAppointment) {
                const date = document.getElementById("appointment_date").value;
                const time = document.getElementById("appointment_time").value;

                if (!date || !time) {
                    alert("Please fill in the appointment date and time.");
                    return;
                }

                const patientData = {
                    name: userName,
                    idno: idNumber,
                    dob: dob,
                    illness: illness,
                    medication: medication,
                    appointmentDate: date,
                    appointmentTime: time
                };
                localStorage.setItem("patientData", JSON.stringify(patientData));

                alert("Thank you " + userName + ". Quick Recovery Ahead!");
                window.location.href = "Form1.html";
            } else {
                const patientData = {
                    name: userName,
                    idno: idNumber,
                    dob: dob,
                    illness: illness,
                    medication: medication
                };
                localStorage.setItem("patientData", JSON.stringify(patientData));

                alert("Thank you " + userName + ". Come Again.\nThe Mader Hospital. We care.");
                window.location.href = "Form1.html";
            }
        }

        window.onload = populateIllnesses;
    </script>
</head>
<body style="text-align: center;">
    <h1>The Mader Hospital Patient Form</h1>
    <form onsubmit="handleSubmit(event)">
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required onchange="checkAge()"><br><br>

        <div id="idnoField">
            <label for="idno">ID Number:</label><br>
            <input type="text" id="idno" name="idno" 
                   pattern="\d{8,9}" maxlength="9" 
                   title="ID number must be 8 or 9 digits"><br><br>
        </div>

        <label for="sickness">Select Your Illness:</label><br>
        <select id="sickness" name="sickness" onchange="suggestMedication()" required>
            <option value="">--Choose Illness--</option>
        </select><br><br>

        <label for="medication">Suggested Treatment:</label><br>
        <input type="text" id="medication" name="medication" readonly><br><br>

        <label for="appointment">Book an Appointment:</label><br>
        <input type="date" id="appointment_date" name="appointment_date">
        <input type="time" id="appointment_time" name="appointment_time"><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
